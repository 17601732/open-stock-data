name: Update Option PCR Data

on:
  workflow_dispatch: # 允许在网页上手动点击运行
  schedule:
    - cron: '30 8 * * 1-5' # 每天北京时间 16:30 自动运行 (UTC+8)

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须要有这个权限，才能 git push 回仓库

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas

      - name: Run Script
        # 直接运行 AKShare 脚本，因为它很稳定
        run: python scripts/calc_option_pcr.py

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add option_pcr_50etf.csv
          # 下面这行代码的意思是：如果有文件变化才提交，没变化就跳过，防止报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update option PCR data" && git push)
