name: Update Option PCR Data

on:
  workflow_dispatch: # 允许在网页上手动点击运行
  schedule:
    # 北京时间 21:00 (UTC 13:00): 上交所当日期权统计通常在盘后发布, 16:30 太早会拿到空表
    - cron: '0 13 * * 1-5'

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 必须要有这个权限，才能 git push 回仓库

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 只读复用雷达的原始缓存(index_daily.parquet 提供交易日历); 不回写, 避免污染雷达缓存
      - name: Restore radar raw cache (read-only)
        uses: actions/cache/restore@v4
        with:
          path: data/radar
          key: radar-raw-${{ github.run_id }}
          restore-keys: |
            radar-raw-

      - name: Install dependencies
        run: uv sync

      # 必须以模块方式运行: 直接执行 scripts/calc_option_pcr.py 时 sys.path 是 scripts/,
      # 会报 ModuleNotFoundError: No module named 'scripts'
      - name: Run PCR script
        run: uv run python -m scripts.calc_option_pcr

      - name: Verify PCR output
        run: |
          test -s data/radar/option_pcr_etf.csv
          test -s option_pcr_50etf.csv
          uv run python - <<'PY'
          import pandas as pd
          d = pd.read_csv('data/radar/option_pcr_etf.csv')
          o = pd.read_csv('option_pcr_50etf.csv')
          assert len(d) > 100, f"PCR 空表: {len(d)}"
          assert d['pcr'].notna().sum() > 100, "PCR 指标全为空"
          assert o['pcr_vol'].notna().sum() > 100, "50ETF PCR 指标全为空"
          print('pcr rows', len(d), d['date'].min(), '~', d['date'].max(),
                'latest pcr', round(float(d['pcr'].dropna().iloc[-1]), 4))
          PY

      - name: Commit and Push
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add option_pcr_50etf.csv data/radar/option_pcr_etf.csv
          # 只看已暂存的变化: 缓存恢复会把 snapshot.json 等文件改成工作区脏状态,
          # 用 `git diff --quiet` 会把这类无关改动当成"有变化", 进而空提交失败。
          git diff --staged --quiet || (git commit -m "Update option PCR data" && git pull --rebase --autostash origin main && git push)
