name: 计算30日TRIN

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 运行计算脚本
        run: python scripts/calc_trin_30d.py
      - name: 提交并保存结果
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add trin_30d.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update TRIN data" && git push)
