name: 计算2020至今TRIN并画图

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装画图库
        run: pip install matplotlib

      - name: 下载通达信数据包
        run: |
          curl -L -o hsjday.1.zip https://github.com/17601732/open-stock-data/releases/download/tdx-data/hsjday.1.zip

      - name: 运行解析与计算脚本
        run: python scripts/calc_trin_30d.py

      - name: 提交并保存结果
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          # 清理旧文件
          rm -f trin_30d.csv trin_180d.csv trin_history.csv
          # 提交新生成的文件
          git add trin_2020_now.csv trin_chart.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update TRIN chart and 2020-present data" && git push)
