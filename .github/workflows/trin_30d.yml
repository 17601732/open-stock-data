name: 每日增量计算TRIN

on:
  workflow_dispatch:
  schedule:
    - cron: '10 8 * * 1-5'  # 北京时间 16:10 运行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装画图库
        run: pip install matplotlib

      - name: 运行增量计算脚本
        run: python scripts/calc_trin_30d.py

      - name: 提交并保存结果
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add trin_2020_now.csv trin_chart.png
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update daily TRIN data and chart" && git push)
