name: Update Radar Snapshot

on:
  schedule:
    # 北京时间 18:30 (UTC 10:30), 收盘后数据定稿
    - cron: "30 10 * * 1-5"
    # 兜底重试: 北京时间 21:30 (UTC 13:30)。GitHub 定时任务常延迟数小时甚至跳过,
    # 第二次运行是幂等的(同日期重复 upsert), 可显著降低「当天漏跑」概率
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      full:
        description: "全量重建(忽略已有增量)"
        required: false
        default: "false"
      with_holders:
        description: "额外抓取股东增减持(首次全量约 5 分钟, 有缓存时只补最近 2 个月)"
        required: false
        default: "true"

jobs:
  update-radar:
    runs-on: ubuntu-latest
    # 定时与手动触发共用同一份原始数据缓存, 串行执行避免缓存互相覆盖
    concurrency:
      group: update-radar
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # 原始 Parquet/CSV 不进 git, 用 Actions 缓存实现"只抓增量"; 缓存丢失时自动退化为全量
      - name: Restore radar raw cache
        uses: actions/cache@v4
        with:
          path: data/radar
          key: radar-raw-${{ github.run_id }}
          restore-keys: |
            radar-raw-

      - name: Install dependencies
        run: uv sync

      # TRIN 上游(新浪)只有当日全市场快照, 必须每天落库; 失败不阻塞快照, 但会在最后一步显式报错告警
      - name: Update TRIN (Sina snapshot)
        id: trin
        continue-on-error: true
        run: uv run python scripts/calc_trin_30d.py

      - name: Update radar inputs
        env:
          INPUT_FULL: ${{ github.event.inputs.full || 'false' }}
          INPUT_HOLDERS: ${{ github.event.inputs.with_holders || 'true' }}
        run: |
          ARGS=""
          if [ "$INPUT_FULL" = "true" ]; then ARGS="$ARGS --full"; fi
          if [ "$INPUT_HOLDERS" = "true" ]; then ARGS="$ARGS --with-holders"; fi
          uv run python -m scripts.update_radar $ARGS

      - name: Verify snapshot
        run: |
          test -s data/radar/snapshot.json
          uv run python - <<'PY'
          import json
          d = json.load(open('data/radar/snapshot.json'))
          pcr = d['indicator_history']['pcr_5d']
          cutoff = d['meta']['data_cutoff']
          keys = {i['key'] for i in d['indicators']}
          assert len(d['indicators']) >= 15, f"indicators={len(d['indicators'])}"
          assert 'trin_raw' in keys and 'trin_30d' in keys, f"TRIN 未进入指标列表: {sorted(keys)}"
          assert 'trin_raw' in d['indicator_daily']['values'], "TRIN 日频序列缺失"
          assert len(pcr) >= 100 and pcr[-1][0] >= cutoff, f"pcr 序列疑似断档: {pcr[-1]} vs {cutoff}"
          gaps = d['meta'].get('indicator_gaps', {})
          print('cutoff', cutoff, 'score', d['latest']['score'],
                'indicators', len(d['indicators']), 'signals', len(d['signals']),
                'pcr_weekly', len(pcr), pcr[-1],
                'trin_gap', gaps.get('trin_raw', {}).get('missing_dates', []))
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar/snapshot.json trin_2020_now.csv
          if git diff --cached --quiet; then
            echo "快照无变化, 跳过提交"
          else
            git commit -m "chore(radar): update snapshot $(date -u +%Y-%m-%d)"
            # 其它 workflow(如 TRIN)也可能提交 main, 先 rebase 再推, 避免 non-fast-forward 失败
            git pull --rebase origin main || true
            git push
          fi

      # 快照已提交后再显式失败, 保证"数据照常更新 + 失败可被邮件通知"
      - name: Notify TRIN failure
        if: steps.trin.outcome != 'success'
        run: |
          echo "::error::TRIN 当日快照抓取失败, 缺口已写入 meta.indicator_gaps; 请检查新浪接口/runner 网络"
          exit 1

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: radar-snapshot
          path: data/radar/snapshot.json
          retention-days: 7
