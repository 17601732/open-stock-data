name: Calculate TRIN Data

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 10 * * 1-5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: pip install pandas pyarrow
        
      - name: Run TRIN script
        run: python calc_trin.py
        
      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: trin-result-csv
          path: trin_result.csv
